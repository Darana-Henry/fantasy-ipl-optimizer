<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy IPL Booster Optimizer — Live</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <h1>⚡ Fantasy IPL Booster Optimizer</h1>
  <p>Live data from Google Sheets · Auto-updates on every page load</p>
  <div class="header-meta">
    <div class="live-badge"><span class="live-dot"></span> Live Google Sheets</div>
  </div>
</header>

<div class="last-updated" id="last-updated-bar">
  Fetching latest data…
  <button id="refresh-btn">↻ Refresh</button>
</div>

<div id="app" style="display:none">
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="foreign">⭐ Foreign Stars <small style="opacity:0.7">(Max 4)</small></button>
    <button class="tab-btn" data-tab="indian">🏏 Indian Warriors <small style="opacity:0.7">(Max 11)</small></button>
    <button class="tab-btn" data-tab="captain">👑 Triple Captain</button>
    <button class="tab-btn" data-tab="history">🏆 Foreign Royale</button>
    <button class="tab-btn" data-tab="indianroyale">🇮🇳 Indian Royale</button>
    <button class="tab-btn" data-tab="transfers">🔄 Transfer Planner</button>
  </nav>

  <div class="content">
    <div class="tab-pane active" id="pane-foreign">
      <div class="info-bar" id="info-foreign"></div>
      <div class="search-bar">
        <input type="text" id="search-foreign" placeholder="🔍  Search by team, player, match…">
        <span class="result-count" id="count-foreign"></span>
      </div>
      <div id="cards-foreign"></div>
    </div>

    <div class="tab-pane" id="pane-indian">
      <div class="info-bar" id="info-indian"></div>
      <div class="search-bar">
        <input type="text" id="search-indian" placeholder="🔍  Search by team, player, match…">
        <span class="result-count" id="count-indian"></span>
      </div>
      <div id="cards-indian"></div>
    </div>

    <div class="tab-pane" id="pane-captain">
      <div class="info-bar" id="info-captain"></div>
      <div class="search-bar">
        <input type="text" id="search-captain" placeholder="🔍  Search by player, team, or match…">
        <span class="result-count" id="count-captain"></span>
      </div>
      <div id="cards-captain"></div>
    </div>

    <div class="tab-pane" id="pane-history">
      <div class="info-bar" id="info-history"></div>
      <div class="search-bar">
        <input type="text" id="search-history" placeholder="🔍  Search by player, team, or date…">
        <span class="result-count" id="count-history"></span>
      </div>
      <div id="cards-history"></div>
    </div>

    <div class="tab-pane" id="pane-indianroyale">
      <div class="info-bar" id="info-indianroyale"></div>
      <div class="search-bar">
        <input type="text" id="search-indianroyale" placeholder="🔍  Search by player, team, or date…">
        <span class="result-count" id="count-indianroyale"></span>
      </div>
      <div id="cards-indianroyale"></div>
    </div>

    <div class="tab-pane" id="pane-transfers">
      <div id="tp-app"></div>
    </div>
  </div>
</div>

<div id="loading-screen" class="loading-screen">
  <div class="spinner"></div>
  <div class="loading-text">Fetching live data from Google Sheets…</div>
  <div class="loading-sub">Pulling Player Data &amp; Fixture List</div>
</div>

<div id="error-screen" class="error-screen">
  <div class="error-icon">⚠️</div>
  <div class="error-title">Could not load data</div>
  <div class="error-msg" id="error-msg-text"></div>
  <div class="error-url" id="error-url-text"></div>
  <button id="refresh-btn-2" style="margin-top:16px;background:var(--ipl-blue);border:1px solid var(--ipl-sky);color:#fff;padding:10px 24px;border-radius:8px;cursor:pointer;font-size:0.9rem;">↻ Try Again</button>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
